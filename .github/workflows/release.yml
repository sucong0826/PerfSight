name: Build and Release PerfSight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-client:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: perf-sight/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build macOS client
        if: matrix.platform == 'macos-arm64'
        run: bash scripts/build-macos.sh

      - name: Upload macOS client artifact
        if: matrix.platform == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-arm64
          path: artifacts/PerfSight-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows client
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Package browser extension
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: Compress-Archive -Path perf-sight-extension -DestinationPath artifacts/perf-sight-extension.zip -Force

      - name: Upload Windows client artifacts
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-x64
          path: |
            artifacts/PerfSight-windows-x64.msi
            artifacts/perf-sight-extension.zip
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-client
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-macos-arm64
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-windows-x64
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum PerfSight-macos-arm64.zip PerfSight-windows-x64.msi perf-sight-extension.zip > SHA256SUMS

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/PerfSight-macos-arm64.zip
            release-assets/PerfSight-windows-x64.msi
            release-assets/perf-sight-extension.zip
            release-assets/SHA256SUMS
